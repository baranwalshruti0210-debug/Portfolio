<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shruti's Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ffe6f0, #ffd6eb);
            text-align: center;
        }

        header {
            background: #ff66b2;
            color: white;
            padding: 30px;
        }

        h1 {
            font-size: 50px;
            margin: 0;
        }

        .name {
            color: #ff1493;
            font-weight: bold;
        }

        .content {
            padding: 50px;
        }

        button {
            background: #ff3399;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #e60073;
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to <span class="name">Shruti</span>'s Website 💖</h1>
</header>

<div class="content">
    <h2>Hello, I'm Shruti 👋</h2>
    <p>This is my personal website. I'm learning how to build websites!</p>

    <button onclick="alert('Welcome to Shruti’s website! 🎉')">
        Click Me
    </button>
</div>

</body>
</html>
